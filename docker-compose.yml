services:
  db:
    image: postgres:16-alpine
    container_name: estulanches-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-estulanches}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estulanches}
      POSTGRES_DB: ${DB_NAME:-estulanches}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-estulanches} -d ${DB_NAME:-estulanches}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: estulanches-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-estulanches}
      DB_PASSWORD: ${DB_PASSWORD:-estulanches}
      DB_NAME: ${DB_NAME:-estulanches}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
