<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EstuLanches — Cantina Escolar</title>
<style>
  :root { --verde:#2f7d4f; --verde-claro:#e8f4ec; --cinza:#f5f5f2; --borda:#dcdcd6; --texto:#22302a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--cinza); color:var(--texto); }
  header { background:var(--verde); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:1.4rem; }
  header p { margin:2px 0 0; opacity:.85; font-size:.9rem; }
  main { max-width:1000px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns: 1fr 1fr; }
  @media (max-width:760px){ main { grid-template-columns:1fr; } }
  section { background:#fff; border:1px solid var(--borda); border-radius:10px; padding:14px; }
  section.largo { grid-column:1 / -1; }
  h2 { margin:0 0 10px; font-size:1.05rem; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--borda); }
  li:last-child { border-bottom:0; }
  .preco { color:var(--verde); font-weight:600; white-space:nowrap; }
  button { background:var(--verde); color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:.9rem; }
  button.sec { background:#fff; color:var(--verde); border:1px solid var(--verde); }
  button.perigo { background:#fff; color:#b3261e; border:1px solid #b3261e; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input { padding:7px 9px; border:1px solid var(--borda); border-radius:6px; font-size:.95rem; width:100%; }
  .linha { display:flex; gap:8px; margin-top:8px; }
  .total { font-weight:700; margin-top:10px; font-size:1.05rem; }
  .vazio { color:#7a857f; font-size:.9rem; }
  .badge { font-size:.75rem; padding:2px 8px; border-radius:99px; background:var(--verde-claro); color:var(--verde); font-weight:600; }
  .badge.CANCELADO { background:#fde8e6; color:#b3261e; }
  #msg { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#22302a; color:#fff; padding:10px 16px; border-radius:8px; display:none; max-width:90%; }
  #msg.erro { background:#b3261e; }
</style>
</head>
<body>
<header>
  <h1>🥪 EstuLanches</h1>
  <p>Cardápio e pedidos da cantina escolar</p>
</header>

<main>
  <section>
    <h2>Cardápio</h2>
    <ul id="cardapio"></ul>
    <h2 style="margin-top:16px">Novo item</h2>
    <div class="linha">
      <input id="novoNome" placeholder="Nome (ex.: Bolo de cenoura)">
      <input id="novoPreco" type="number" step="0.01" min="0" placeholder="Preço" style="max-width:110px">
    </div>
    <div class="linha"><button id="btnNovo">Adicionar ao cardápio</button></div>
  </section>

  <section>
    <h2>Seu pedido</h2>
    <ul id="carrinho"></ul>
    <div class="total" id="total">Total: R$ 0,00</div>
    <input id="cliente" placeholder="Nome do aluno" style="margin-top:10px">
    <div class="linha">
      <button id="btnPedido">Finalizar pedido</button>
      <button id="btnLimpar" class="sec">Limpar</button>
    </div>
  </section>

  <section class="largo">
    <h2>Pedidos</h2>
    <ul id="pedidos"></ul>
  </section>
</main>
<div id="msg"></div>

<script>
const brl = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const PROXIMO = { PENDENTE: 'EM_PREPARO', EM_PREPARO: 'PRONTO', PRONTO: 'ENTREGUE' };
const NOME_STATUS = { PENDENTE: 'Pendente', EM_PREPARO: 'Em preparo', PRONTO: 'Pronto', ENTREGUE: 'Entregue', CANCELADO: 'Cancelado' };

let cardapio = [];
const carrinho = new Map(); // item_id -> quantidade

const $ = (id) => document.getElementById(id);

function aviso(texto, erro = false) {
  const el = $('msg');
  el.textContent = texto;
  el.className = erro ? 'erro' : '';
  el.style.display = 'block';
  clearTimeout(aviso.t);
  aviso.t = setTimeout(() => (el.style.display = 'none'), 3500);
}

async function api(metodo, caminho, corpo) {
  const res = await fetch(caminho, {
    method: metodo,
    headers: { 'Content-Type': 'application/json' },
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  const dados = await res.json();
  if (!res.ok) throw new Error((dados.erros || ['Erro inesperado']).join('; '));
  return dados;
}

function el(tag, texto, classe) {
  const e = document.createElement(tag);
  if (texto !== undefined) e.textContent = texto;
  if (classe) e.className = classe;
  return e;
}

function desenharCardapio() {
  const ul = $('cardapio');
  ul.replaceChildren();
  cardapio.forEach((item) => {
    const li = el('li');
    const nome = el('span', item.nome);
    const dir = el('span');
    dir.append(el('span', brl(item.preco), 'preco'), document.createTextNode(' '));
    const b = el('button', '+ Adicionar');
    b.disabled = !item.disponivel;
    b.onclick = () => { carrinho.set(item.id, (carrinho.get(item.id) || 0) + 1); desenharCarrinho(); };
    dir.append(b);
    li.append(nome, dir);
    ul.append(li);
  });
}

function desenharCarrinho() {
  const ul = $('carrinho');
  ul.replaceChildren();
  let total = 0;
  if (carrinho.size === 0) ul.append(el('li', 'Nenhum item ainda.', 'vazio'));
  carrinho.forEach((qtd, id) => {
    const item = cardapio.find((i) => i.id === id);
    if (!item) return;
    total += Math.round(item.preco * 100) * qtd;
    const li = el('li');
    li.append(el('span', `${qtd}× ${item.nome}`));
    const b = el('button', 'Remover', 'sec');
    b.onclick = () => { qtd > 1 ? carrinho.set(id, qtd - 1) : carrinho.delete(id); desenharCarrinho(); };
    li.append(b);
    ul.append(li);
  });
  $('total').textContent = 'Total: ' + brl(total / 100);
}

async function carregarCardapio() {
  cardapio = await api('GET', '/cardapio');
  desenharCardapio();
  desenharCarrinho();
}

async function carregarPedidos() {
  const lista = await api('GET', '/pedidos');
  const ul = $('pedidos');
  ul.replaceChildren();
  if (!lista.length) ul.append(el('li', 'Nenhum pedido ainda.', 'vazio'));
  lista.forEach((p) => {
    const li = el('li');
    const esq = el('span');
    esq.append(el('strong', `#${p.id} · ${p.cliente}`), document.createTextNode(' — '), el('span', brl(p.total), 'preco'));
    const dir = el('span');
    dir.append(el('span', NOME_STATUS[p.status] || p.status, 'badge ' + p.status), document.createTextNode(' '));
    if (PROXIMO[p.status]) {
      const b = el('button', '→ ' + NOME_STATUS[PROXIMO[p.status]]);
      b.onclick = () => mudarStatus(p.id, PROXIMO[p.status]);
      dir.append(b, document.createTextNode(' '));
    }
    if (p.status === 'PENDENTE' || p.status === 'EM_PREPARO') {
      const c = el('button', 'Cancelar', 'perigo');
      c.onclick = () => mudarStatus(p.id, 'CANCELADO');
      dir.append(c);
    }
    li.append(esq, dir);
    ul.append(li);
  });
}

async function mudarStatus(id, status) {
  try { await api('PATCH', `/pedidos/${id}/status`, { status }); await carregarPedidos(); }
  catch (e) { aviso(e.message, true); }
}

$('btnPedido').onclick = async () => {
  try {
    const itens = [...carrinho].map(([item_id, quantidade]) => ({ item_id, quantidade }));
    const p = await api('POST', '/pedidos', { cliente: $('cliente').value, itens });
    aviso(`Pedido #${p.id} criado! Total ${brl(p.total)}`);
    carrinho.clear(); $('cliente').value = '';
    desenharCarrinho(); await carregarPedidos();
  } catch (e) { aviso(e.message, true); }
};

$('btnLimpar').onclick = () => { carrinho.clear(); desenharCarrinho(); };

$('btnNovo').onclick = async () => {
  try {
    await api('POST', '/cardapio', { nome: $('novoNome').value, preco: parseFloat($('novoPreco').value) });
    $('novoNome').value = ''; $('novoPreco').value = '';
    aviso('Item adicionado ao cardápio'); await carregarCardapio();
  } catch (e) { aviso(e.message, true); }
};

carregarCardapio().then(carregarPedidos).catch((e) => aviso(e.message, true));
</script>
</body>
</html>
